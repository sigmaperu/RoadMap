<!-- partials/header.html -->
<header class="topbar">
  <!-- Izquierda: menú + título -->
  <div class="topbar__left">
    <button class="icon-button icon-button--menu" aria-label="Menú" id="menuToggle">
      <span class="material-icons">menu</span>
    </button>
    <h1 id="pageTitle">RoadMap</h1>
  </div>

  <!-- Centro: animación (oculta en móvil) -->
  <div class="topbar__center">
    <div class="truck-animation" aria-hidden="true">
      <div class="scenery">
        <!-- Cielo -->
        <div class="bg bg-clouds"></div>
        <div class="bg-sun"></div>
        <!-- Fondo (más lejano) -->
        <div class="bg bg-hills"></div>
        <div class="bg bg-city"></div>
        <!-- Medio (nuevo): casas -->
        <div class="bg bg-houses"></div>
        <!-- Frente (nuevo): fábricas / galpones -->
        <div class="bg bg-industry"></div>
        <!-- Primer plano: arbolado -->
        <div class="bg bg-trees"></div>
      </div>

      <!-- Pista + camión -->
      <div class="truck-lane">
        <span class="truck-emoji"><span class="truck-emoji-run">🚚</span></span>
        <div class="truck-road"></div>
      </div>
    </div>
  </div>

  <!-- Derecha: fecha (oculta en móvil) -->
  <div class="topbar__right">
    <div id="topbarFecha" class="topbar-fecha">--/--/----</div>
  </div>
</header>
