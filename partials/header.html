<!-- partials/header.html -->
<header class="topbar">
  <div class="topbar__title">
    <button class="icon-button icon-button--menu" aria-label="Menú" id="menuToggle">
      <span class="material-icons">menu</span>
    </button>
    <h1 id="pageTitle">RoadMap</h1>
  </div>

  <!-- Camioncito animado: mirando a la derecha -->
  <div class="truck-animation">
    <div class="truck-animation-inner">
      <div id="topbarFecha" class="topbar-fecha"></div>
      <!-- Contenedor de volteo + contenedor de movimiento -->
      <span class="truck-emoji">
        <span class="truck-emoji-run">🚚</span>
      </span>
      <div class="truck-road"></div>
    </div>
  </div>

  <div class="topbar__actions">
    <button class="icon-button" aria-label="Notificaciones">
      <span class="material-icons">notifications</span>
    </button>
    <button class="icon-button" aria-label="Perfil">
      <span class="material-icons">account_circle</span>
    </button>
  </div>
</header>
