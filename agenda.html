<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap – Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=6.0">

  <script defer src="assets/js/main.js"></script>
</head>
<body data-title="Agenda">
  <div class="app-shell">
    <!-- Sidebar modular inyectado automáticamente -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-layout">
      <!-- Header modular -->
      <div id="app-header"></div>

      <main class="content">
        <section class="page-section">
          <div class="agenda-card">
            
            <!-- Barra de Filtros y Estadísticas en Vivo -->
            <div class="agenda-filters">
              <div class="agenda-filters-inner">
                <div class="agenda-filters__group">
                  <select id="agendaCentro" title="Seleccionar Centro Operativo"></select>
                </div>

                <!-- KPIs Rápidos en Vivo -->
                <div id="agendaKpis" class="agenda-kpis" style="display:none;">
                  <span class="kpi-chip"><span class="material-icons">group</span> <strong id="kpiClientes">0</strong> Clientes</span>
                  <span class="kpi-chip"><span class="material-icons">local_shipping</span> <strong id="kpiVehiculos">0</strong> Placas</span>
                </div>

                <div class="agenda-search-box">
                  <div id="agendaSearchBar" class="agenda-search-bar">
                    <input id="agendaSearchInput" class="agenda-search-input" type="text" placeholder="Buscar por placa, cliente, ruta...">
                  </div>
                  <button id="agendaSearchToggle" class="agenda-search-toggle" type="button" aria-label="Buscar">
                    <span class="material-icons">search</span>
                  </button>
                  <!-- Botón Copiar Reporte al Portapapeles -->
                  <button id="agendaCopyBtn" class="agenda-search-toggle" type="button" title="Copiar reporte filtrado para WhatsApp" style="background:#25D366; display:none;">
                    <span class="material-icons">content_copy</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Tabla de Resultados con Estilo Fowllow -->
            <div class="agenda-table-wrapper" id="agendaResults" style="display:none;">
              <table id="agendaTable" class="agenda-table">
                <thead>
                  <tr>
                    <th><span class="material-icons agenda-th-icon">local_shipping</span>Placa</th>
                    <th><span class="material-icons agenda-th-icon">badge</span>Cliente</th>
                    <th><span class="material-icons agenda-th-icon">person</span>Nombre</th>
                    <th><span class="material-icons agenda-th-icon">schedule</span>VH</th>
                    <th><span class="material-icons agenda-th-icon">business_center</span>Ruta</th>
                    <th><span class="material-icons agenda-th-icon">group</span>Auxiliar</th>
                    <th><span class="material-icons agenda-th-icon">phone</span>Teléfono</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

          </div>
        </section>
      </main>
    </div>
  </div>

  <style>
    /* Estilos adicionales para los KPIs y chips modernos */
    .agenda-kpis {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
    }
    .kpi-chip {
      background: #f1f5f9;
      color: #334155;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #e2e8f0;
    }
    .kpi-chip .material-icons {
      font-size: 16px;
      color: var(--primary);
    }
    @media (max-width: 920px) {
      .agenda-kpis { display: none; }
    }
  </style>

  <script>
  (() => {
    const CSV_URL = (window.RoadMapConfig && window.RoadMapConfig.CSV_URL) || "https://raw.githubusercontent.com/sigmaperu/RoadMap/main/RoadMap.csv";
    const LS_CENTRO_KEY = "roadmap.agenda.centro";
    const LS_SEARCH_KEY = "roadmap.agenda.search";

    let agendaRows = [];
    let centrosAgenda = [];
    let hasSearched = false;
    let filteredCache = [];

    const agendaCentroSelect = document.getElementById("agendaCentro");
    const agendaSearchToggle = document.getElementById("agendaSearchToggle");
    const agendaSearchBar = document.getElementById("agendaSearchBar");
    const agendaSearchInput = document.getElementById("agendaSearchInput");
    const agendaTableBody = document.querySelector("#agendaTable tbody");
    const agendaResults = document.getElementById("agendaResults");
    const agendaKpis = document.getElementById("agendaKpis");
    const kpiClientes = document.getElementById("kpiClientes");
    const kpiVehiculos = document.getElementById("kpiVehiculos");
    const agendaCopyBtn = document.getElementById("agendaCopyBtn");

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      if (lines.length === 0) return { header: [], rows: [] };
      const header = lines[0].split(",");
      const rows = lines.slice(1).map(line => {
        const result = []; let current = ""; let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') { if (inQuotes && line[i + 1] === '"') { current += '"'; i++; } else { inQuotes = !inQuotes; } }
          else if (char === "," && !inQuotes) { result.push(current); current = ""; }
          else { current += char; }
        }
        result.push(current);
        return result;
      });
      return { header, rows };
    }
    const unique = arr => Array.from(new Set(arr.filter(v => v !== "" && v != null)));

    function loadCentros() {
      centrosAgenda = unique(agendaRows.map(r => r[1] || "")).sort();
      agendaCentroSelect.innerHTML = "";
      centrosAgenda.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c;
        agendaCentroSelect.appendChild(opt);
      });

      const savedCentro = localStorage.getItem(LS_CENTRO_KEY);
      if (savedCentro && centrosAgenda.includes(savedCentro)) {
        agendaCentroSelect.value = savedCentro;
      } else if (centrosAgenda.length > 0) {
        agendaCentroSelect.value = centrosAgenda[0];
      }
    }

    const buildNombre = r => { const a=r[4]||"", b=r[5]||""; return (b && b!=="0" && b.toLowerCase()!=="error") ? (a?`${a} - ${b}`:b) : a; };
    const buildRuta = r => { const a=r[6]||"", b=r[19]||""; return (b && b!=="0" && b.toLowerCase()!=="error") ? (a?`${a} - ${b}`:b) : a; };
    const buildDireccion = r => { const d1=r[15]||"", d2=r[14]||""; return (d2 && d2!=="0" && d2.toLowerCase()!=="error") ? (d1?`${d1} - ${d2}`:d2):d1; };
    function googleMapsLink(r) {
      const lat = parseFloat((r[16] || "").replace(",", ".")); const lng = parseFloat((r[17] || "").replace(",", "."));
      if (Number.isNaN(lat) || Number.isNaN(lng)) return null;
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng);
    }
    const cleanPhone = s => (s || "").replace(/[^0-9]/g, "");

    function groupByCliente(rows) {
      const map = new Map();
      rows.forEach(r => {
        const key = (r[1] || "") + "\n" + (r[3] || "");
        if ((r[3] || "") && !map.has(key)) map.set(key, r);
      });
      return Array.from(map.values());
    }

    function renderAgenda() {
      if (!hasSearched) { 
        agendaResults.style.display = "none"; 
        agendaKpis.style.display = "none";
        agendaCopyBtn.style.display = "none";
        agendaTableBody.innerHTML = ""; 
        return; 
      }
      const centroSel = agendaCentroSelect.value;
      const term = (agendaSearchInput.value || "").toLowerCase().trim();
      
      localStorage.setItem(LS_CENTRO_KEY, centroSel);
      localStorage.setItem(LS_SEARCH_KEY, term);

      let rows = agendaRows.filter(r => (r[1] || "") === centroSel);

      if (term) {
        rows = rows.filter(r => {
          const placa = (r[2] || "").toLowerCase();
          const cliente = (r[3] || "").toLowerCase();
          const nombre = (buildNombre(r) || "").toLowerCase();
          const ruta = (buildRuta(r) || "").toLowerCase();
          const auxiliar = (r[12] || "").toLowerCase();
          const telefono = (r[13] || "").toLowerCase();
          const direccion = (buildDireccion(r) || "").toLowerCase();
          return placa.includes(term) || cliente.includes(term) || nombre.includes(term) ||
                 ruta.includes(term) || auxiliar.includes(term) || telefono.includes(term) || direccion.includes(term);
        });
      }

      filteredCache = groupByCliente(rows);
      
      // Actualizar KPIs en vivo
      kpiClientes.textContent = filteredCache.length;
      kpiVehiculos.textContent = new Set(filteredCache.map(r => r[2])).size;
      agendaKpis.style.display = "inline-flex";
      agendaCopyBtn.style.display = filteredCache.length > 0 ? "inline-flex" : "none";

      agendaTableBody.innerHTML = "";

      filteredCache.forEach(r => {
        const placa = r[2] || ""; const cliente = r[3] || "";
        const nombre = buildNombre(r); const vh = r[18] || "";
        const ruta = buildRuta(r); const auxiliar = r[12] || "";
        const telefono = r[13] || ""; const dir = buildDireccion(r);
        const mapsUrl = googleMapsLink(r);

        const tr = document.createElement("tr");
        const td = (v,l) => { const c=document.createElement("td"); c.setAttribute("data-label",l); c.textContent=v||"-"; return c; };
        tr.appendChild(td(placa,"Placa"));
        tr.appendChild(td(cliente,"Cliente"));

        const tdNombre = document.createElement("td");
        tdNombre.setAttribute("data-label","Nombre");
        const spanNombre = document.createElement("span");
        spanNombre.className="agenda-name";
        const sTexto = document.createElement("span"); sTexto.textContent = nombre || "-";
        spanNombre.appendChild(sTexto);
        if (mapsUrl) {
          const btn = document.createElement("button");
          btn.type="button"; btn.className="agenda-map-icon"; btn.title=dir||"Ver dirección";
          btn.onclick = e => { e.stopPropagation(); window.open(mapsUrl,"_blank"); };
          btn.innerHTML = `<svg viewBox="0 0 24 24" class="map-pin" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>`;
          spanNombre.appendChild(btn);
        }
        tdNombre.appendChild(spanNombre);
        tr.appendChild(tdNombre);

        tr.appendChild(td(vh,"VH"));
        tr.appendChild(td(ruta,"Ruta"));
        tr.appendChild(td(auxiliar,"Auxiliar"));

        const tdTel = document.createElement("td");
        tdTel.setAttribute("data-label","Teléfono");
        tdTel.textContent = telefono || "-";
        const phone = cleanPhone(telefono);
        if (phone) {
          const wa = document.createElement("button");
          wa.type="button"; wa.className="agenda-whatsapp-btn";
          wa.onclick = e => { e.stopPropagation(); window.open("https://wa.me/" + phone,"_blank"); };
          wa.innerHTML = `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3.2A12.77 12.77 0 0 0 3.2 16a12.6 12.6 0 0 0 1.78 6.5L3 29l6.7-1.96A12.8 12.8 0 0 0 16 28.8 12.77 12.77 0 0 0 28.8 16 12.8 12.8 0 0 0 16 3.2zm0 22.3a9.5 9.5 0 0 1-4.84-1.34l-.35-.2-4 1.16 1.08-3.9-.23-.37A9.4 9.4 0 0 1 6.5 16 9.5 9.5 0 1 1 16 25.5zm4.94-7.1c-.27-.14-1.59-.8-1.84-.9s-.43-.14-.6.14-.69.9-.84 1.08-.31.2-.58.07a7.7 7.7 0 0 1-2.27-1.4 8 8 0 0 1-1.47-1.8c-.15-.27 0-.42.11-.56s.27-.31.4-.48a1.88 1.88 0 0 0 .27-.45.51.51 0 0 0-.02-.48c-.07-.14-.6-1.44-.82-1.98s-.44-.45-.6-.46h-.5a1 1 0 0 0-.7.33 3 3 0 0 0-.93 2.2 5.2 5.2 0 0 0 1.09 2.76 11.9 11.9 0 0 0 4.55 4 5.2 5.2 0 0 0 3.09.65 2.6 2.6 0 0 0 1.76-1.22 2.15 2.15 0 0 0 .15-1.22c-.06-.1-.24-.17-.5-.3z"/></svg>`;
          tdTel.appendChild(wa);
        }
        tr.appendChild(tdTel);
        agendaTableBody.appendChild(tr);
      });

      if (filteredCache.length === 0) {
        const tr = document.createElement("tr"); const td = document.createElement("td");
        td.colSpan = 7; td.textContent = "No se encontraron registros."; tr.appendChild(td);
        agendaTableBody.appendChild(tr);
      }
      agendaResults.style.display = "block";
    }

    // Copiar reporte al portapapeles
    agendaCopyBtn.addEventListener("click", () => {
      let textoReporte = `*RESUMEN AGENDA - BRAEDT S.A.*\nCentro: ${agendaCentroSelect.value}\nTotal Registros: ${filteredCache.length}\n\n`;
      filteredCache.slice(0, 15).forEach(r => {
        textoReporte += `🚚 Placa: ${r[2]} | 🏷️ Cliente: ${r[3]} | 👤 ${buildNombre(r)} | 📞 ${r[13] || "N/A"}\n`;
      });
      if (filteredCache.length > 15) textoReporte += `\n*(Y ${filteredCache.length - 15} registros más...)*`;

      navigator.clipboard.writeText(textoReporte).then(() => {
        const originalBg = agendaCopyBtn.style.background;
        agendaCopyBtn.style.background = "#0284c7";
        setTimeout(() => { agendaCopyBtn.style.background = originalBg; }, 1500);
      });
    });

    async function initAgenda() {
      try {
        const resp = await fetch(CSV_URL);
        const text = await resp.text();
        const { rows } = parseCSV(text);
        agendaRows = rows;
        loadCentros();

        const savedSearch = localStorage.getItem(LS_SEARCH_KEY);
        if (savedSearch) {
          agendaSearchInput.value = savedSearch;
          agendaSearchBar.classList.add("agenda-search-bar--open");
        }

        if (centrosAgenda.length > 0) { 
          hasSearched = true; 
          renderAgenda(); 
        }
      } catch (err) {
        console.error("Error cargando RoadMap.csv en Agenda:", err);
      }

      agendaCentroSelect.addEventListener("change", () => { hasSearched = true; renderAgenda(); });

      agendaSearchToggle.addEventListener("click", () => {
        const isOpen = agendaSearchBar.classList.toggle("agenda-search-bar--open");
        if (isOpen) agendaSearchInput.focus();
        else { agendaSearchInput.value = ""; hasSearched = true; renderAgenda(); }
      });

      agendaSearchInput.addEventListener("input", () => { hasSearched = true; renderAgenda(); });
    }

    document.addEventListener("DOMContentLoaded", initAgenda);
  })();
  </script>
</body>
</html>
