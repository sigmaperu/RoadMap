<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RoadMap | Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

  <!-- Roboto + Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Estilos globales -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/img/logotipo.png" alt="RoadMap">
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="nav-item">
          <span class="nav-item__icon material-icons">home</span>
          <span class="nav-item__label">Inicio</span>
        </a>
        <a href="agenda.html" class="nav-item nav-item--active">
          <span class="nav-item__icon material-icons">event</span>
          <span class="nav-item__label">Agenda</span>
        </a>
        <a href="dashboard.html" class="nav-item">
          <span class="nav-item__icon material-icons">dashboard</span>
          <span class="nav-item__label">Dashboard</span>
        </a>
        <a href="planif.html" class="nav-item">
          <span class="nav-item__icon material-icons">timeline</span>
          <span class="nav-item__label">Planificación</span>
        </a>
        <a href="planos.html" class="nav-item">
          <span class="nav-item__icon material-icons">map</span>
          <span class="nav-item__label">Planos</span>
        </a>
        <a href="program.html" class="nav-item">
          <span class="nav-item__icon material-icons">view_week</span>
          <span class="nav-item__label">Programación</span>
        </a>
        <a href="ubicame.html" class="nav-item">
          <span class="nav-item__icon material-icons">my_location</span>
          <span class="nav-item__label">Ubícame</span>
        </a>
      </nav>
    </aside>

    <div class="main-layout">
      <header class="topbar">
        <div class="topbar__title">
          <button class="icon-button icon-button--menu" aria-label="Menú" id="menuToggle">
            <span class="material-icons">menu</span>
          </button>
          <h1>Agenda</h1>
        </div>
        <div class="topbar__actions">
          <button class="icon-button" aria-label="Notificaciones">
            <span class="material-icons">notifications</span>
          </button>
          <button class="icon-button" aria-label="Perfil">
            <span class="material-icons">account_circle</span>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="page-section">
          <div class="agenda-card">
            <div class="agenda-filters">
              <div class="agenda-filters-inner">
                <div class="agenda-filters__group">
                  <label for="agendaCentro">Centro</label>
                  <select id="agendaCentro"></select>
                </div>

                <div class="agenda-search-box">
                  <div id="agendaSearchBar" class="agenda-search-bar">
                    <input
                      id="agendaSearchInput"
                      class="agenda-search-input"
                      type="text"
                      placeholder="Buscar por placa, cliente, ruta, etc."
                    />
                  </div>

                  <button id="agendaSearchToggle" class="agenda-search-toggle" type="button" aria-label="Buscar">
                    <span class="material-icons">search</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="agenda-table-wrapper" id="agendaResults" style="display:none;">
              <table id="agendaTable" class="agenda-table">
                <thead>
                  <tr>
                    <th>
                      <span class="material-icons agenda-th-icon">local_shipping</span>
                      Placa
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">badge</span>
                      Cliente
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">person</span>
                      Nombre
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">schedule</span>
                      VH
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">business_center</span>
                      Ruta
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">group</span>
                      Auxiliar
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">phone</span>
                      Teléfono
                    </th>
                    <th>
                      <span class="material-icons agenda-th-icon">location_on</span>
                      Dirección
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <!-- filas por JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/main.js"></script>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/sigmaperu/RoadMap/main/RoadMap.csv";

    let agendaRows = [];
    let centrosAgenda = [];
    let hasSearched = false;

    const agendaCentroSelect = document.getElementById("agendaCentro");
    const agendaSearchToggle = document.getElementById("agendaSearchToggle");
    const agendaSearchBar = document.getElementById("agendaSearchBar");
    const agendaSearchInput = document.getElementById("agendaSearchInput");
    const agendaTableBody = document.querySelector("#agendaTable tbody");
    const agendaResults = document.getElementById("agendaResults");

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      if (lines.length === 0) return { header: [], rows: [] };
      const header = lines[0].split(",");
      const dataLines = lines.slice(1);
      const rows = dataLines.map(line => {
        const result = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      });
      return { header, rows };
    }

    function unique(values) {
      return Array.from(new Set(values.filter(v => v !== "" && v != null)));
    }

    function loadCentros() {
      centrosAgenda = unique(agendaRows.map(r => r[1])).sort();
      agendaCentroSelect.innerHTML = "";
      centrosAgenda.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        agendaCentroSelect.appendChild(opt);
      });
      if (centrosAgenda.length > 0) {
        agendaCentroSelect.value = centrosAgenda[0];
      }
    }

    function buildNombre(row) {
      const nom4 = row[4] || "";
      const nom5 = row[5] || "";
      if (nom5 && nom5 !== "0" && nom5.toLowerCase() !== "error") {
        return nom4 ? (nom4 + " - " + nom5) : nom5;
      }
      return nom4;
    }

    function buildRuta(row) {
      const r6 = row[6] || "";
      const r19 = row[19] || "";
      if (r19 && r19 !== "0" && r19.toLowerCase() !== "error") {
        return r6 ? (r6 + " - " + r19) : r19;
      }
      return r6;
    }

    function buildDireccion(row) {
      const dir15 = row[15] || "";
      const dir14 = row[14] || "";
      let texto = dir15;
      if (dir14 && dir14 !== "0" && dir14.toLowerCase() !== "error") {
        texto = texto ? (texto + " - " + dir14) : dir14;
      }
      return texto;
    }

    function googleMapsLink(row) {
      const lat = parseFloat((row[16] || "").replace(",", "."));
      const lng = parseFloat((row[17] || "").replace(",", "."));
      if (Number.isNaN(lat) || Number.isNaN(lng)) return null;
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng);
    }

    function cleanPhone(phoneRaw) {
      if (!phoneRaw) return "";
      return phoneRaw.replace(/[^0-9]/g, "");
    }

    function groupByCliente(rows) {
      const map = new Map();
      rows.forEach(r => {
        const centro = r[1] || "";
        const cliente = r[3] || "";
        const key = centro + "||" + cliente;
        if (!cliente) return;
        if (!map.has(key)) {
          map.set(key, r);
        }
      });
      return Array.from(map.values());
    }

    function renderAgenda() {
      if (!hasSearched) {
        agendaResults.style.display = "none";
        agendaTableBody.innerHTML = "";
        return;
      }

      const centroSel = agendaCentroSelect.value;
      const term = (agendaSearchInput.value || "").toLowerCase().trim();

      let rows = agendaRows.filter(r => r[1] === centroSel);

      if (term) {
        rows = rows.filter(r => {
          const placa = (r[2] || "").toLowerCase();
          const cliente = (r[3] || "").toLowerCase();
          const nombre = buildNombre(r).toLowerCase();
          const ruta = buildRuta(r).toLowerCase();
          const auxiliar = (r[12] || "").toLowerCase();
          const telefono = (r[13] || "").toLowerCase();
          const direccion = buildDireccion(r).toLowerCase();
          return (
            placa.includes(term) ||
            cliente.includes(term) ||
            nombre.includes(term) ||
            ruta.includes(term) ||
            auxiliar.includes(term) ||
            telefono.includes(term) ||
            direccion.includes(term)
          );
        });
      }

      const grouped = groupByCliente(rows);

      agendaTableBody.innerHTML = "";

      grouped.forEach(r => {
        const placa = r[2] || "";
        const cliente = r[3] || "";
        const nombre = buildNombre(r);
        const vh = r[18] || "";
        const ruta = buildRuta(r);
        const auxiliar = r[12] || "";
        const telefono = r[13] || "";
        const dirTexto = buildDireccion(r);
        const mapsUrl = googleMapsLink(r);

        const tr = document.createElement("tr");

        function td(value, label) {
          const cell = document.createElement("td");
          cell.setAttribute("data-label", label);
          cell.textContent = value || "-";
          return cell;
        }

        tr.appendChild(td(placa, "Placa"));
        tr.appendChild(td(cliente, "Cliente"));
        tr.appendChild(td(nombre, "Nombre"));
        tr.appendChild(td(vh, "VH"));
        tr.appendChild(td(ruta, "Ruta"));
        tr.appendChild(td(auxiliar, "Auxiliar"));

        // Teléfono + botón WhatsApp
        const tdTel = document.createElement("td");
        tdTel.setAttribute("data-label", "Teléfono");
        tdTel.textContent = telefono || "-";
        const phoneClean = cleanPhone(telefono);
        if (phoneClean) {
          const waLink = "https://wa.me/" + phoneClean;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "agenda-whatsapp-btn";
          btn.onclick = (e) => {
            e.stopPropagation();
            window.open(waLink, "_blank");
          };
          btn.innerHTML = `
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path fill="currentColor" d="M16 3.2A12.77 12.77 0 0 0 3.2 16a12.6 12.6 0 0 0 1.78 6.5L3 29l6.7-1.96A12.8 12.8 0 0 0 16 28.8 12.77 12.77 0 0 0 28.8 16 12.8 12.8 0 0 0 16 3.2zm0 22.3a9.5 9.5 0 0 1-4.84-1.34l-.35-.2-4 1.16 1.08-3.9-.23-.37A9.4 9.4 0 0 1 6.5 16 9.5 9.5 0 1 1 16 25.5zm4.94-7.1c-.27-.14-1.59-.8-1.84-.9s-.43-.14-.6.14-.69.9-.84 1.08-.31.2-.58.07a7.7 7.7 0 0 1-2.27-1.4 8 8 0 0 1-1.47-1.8c-.15-.27 0-.42.11-.56s.27-.31.4-.48a1.88 1.88 0 0 0 .27-.45.51.51 0 0 0-.02-.48c-.07-.14-.6-1.44-.82-1.98s-.44-.45-.6-.46h-.5a1 1 0 0 0-.7.33 3 3 0 0 0-.93 2.2 5.2 5.2 0 0 0 1.09 2.76 11.9 11.9 0 0 0 4.55 4 5.2 5.2 0 0 0 3.09.65 2.6 2.6 0 0 0 1.76-1.22 2.15 2.15 0 0 0 .15-1.22c-.06-.1-.24-.17-.5-.3z"/>
            </svg>
          `;
          tdTel.appendChild(btn);
        }
        tr.appendChild(tdTel);

        // Dirección
        const tdDir = document.createElement("td");
        tdDir.setAttribute("data-label", "Dirección");
        if (mapsUrl) {
          const a = document.createElement("a");
          a.href = mapsUrl;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "agenda-link";
          a.textContent = dirTexto || "Ver en mapa";
          tdDir.appendChild(a);
        } else {
          tdDir.textContent = dirTexto || "-";
        }
        tr.appendChild(tdDir);

        agendaTableBody.appendChild(tr);
      });

      if (grouped.length === 0) {
        const trEmpty = document.createElement("tr");
        const tdEmpty = document.createElement("td");
        tdEmpty.colSpan = 8;
        tdEmpty.textContent = "No se encontraron registros.";
        trEmpty.appendChild(tdEmpty);
        agendaTableBody.appendChild(trEmpty);
      }

      agendaResults.style.display = "block";
    }

    async function initAgenda() {
      try {
        const resp = await fetch(CSV_URL);
        const text = await resp.text();
        const { rows } = parseCSV(text);
        agendaRows = rows;
        loadCentros();
      } catch (err) {
        console.error("Error cargando RoadMap.csv en Agenda:", err);
        alert("No se pudo cargar RoadMap.csv para Agenda");
      }

      agendaCentroSelect.addEventListener("change", () => {
        if (hasSearched) renderAgenda();
      });

      agendaSearchToggle.addEventListener("click", () => {
        const isOpen = agendaSearchBar.classList.toggle("agenda-search-bar--open");
        if (isOpen) {
          agendaSearchInput.focus();
        } else {
          agendaSearchInput.value = "";
          hasSearched = false;
          renderAgenda();
        }
      });

      agendaSearchInput.addEventListener("input", () => {
        hasSearched = agendaSearchInput.value.trim().length > 0;
        renderAgenda();
      });
    }

    document.addEventListener("DOMContentLoaded", initAgenda);
  </script>
</body>
</html>
