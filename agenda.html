<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RoadMap | Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

  <!-- Roboto + Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Estilos globales -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/img/logotipo.png" alt="RoadMap">
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="nav-item">
          <span class="nav-item__icon material-icons">home</span>
          <span class="nav-item__label">Inicio</span>
        </a>
        <a href="agenda.html" class="nav-item nav-item--active">
          <span class="nav-item__icon material-icons">event</span>
          <span class="nav-item__label">Agenda</span>
        </a>
        <a href="dashboard.html" class="nav-item">
          <span class="nav-item__icon material-icons">dashboard</span>
          <span class="nav-item__label">Dashboard</span>
        </a>
        <a href="planif.html" class="nav-item">
          <span class="nav-item__icon material-icons">timeline</span>
          <span class="nav-item__label">Planificación</span>
        </a>
        <a href="planos.html" class="nav-item">
          <span class="nav-item__icon material-icons">map</span>
          <span class="nav-item__label">Planos</span>
        </a>
        <a href="program.html" class="nav-item">
          <span class="nav-item__icon material-icons">view_week</span>
          <span class="nav-item__label">Programación</span>
        </a>
        <a href="ubicame.html" class="nav-item">
          <span class="nav-item__icon material-icons">my_location</span>
          <span class="nav-item__label">Ubícame</span>
        </a>
      </nav>
    </aside>

    <div class="main-layout">
      <header class="topbar">
        <div class="topbar__title">
          <button class="icon-button icon-button--menu" aria-label="Menú" id="menuToggle">
            <span class="material-icons">menu</span>
          </button>
          <h1>Agenda</h1>
        </div>
        <div class="topbar__actions">
          <button class="icon-button" aria-label="Notificaciones">
            <span class="material-icons">notifications</span>
          </button>
          <button class="icon-button" aria-label="Perfil">
            <span class="material-icons">account_circle</span>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="page-section">
          <div class="agenda-card">
            <div class="agenda-filters">
              <div class="agenda-filters__group">
                <label for="agendaCentro">Centro</label>
                <select id="agendaCentro"></select>
              </div>

              <button id="agendaSearchToggle" class="agenda-search-toggle" type="button" aria-label="Buscar">
                <span class="material-icons">search</span>
              </button>
            </div>

            <div id="agendaSearchBar" class="agenda-search-bar">
              <input
                id="agendaSearchInput"
                class="agenda-search-input"
                type="text"
                placeholder="Buscar por placa, cliente, nombre, ruta, auxiliar, teléfono o dirección..."
              />
            </div>

            <div class="agenda-table-wrapper">
              <table id="agendaTable" class="agenda-table">
                <thead>
                  <tr>
                    <th>Placa</th>
                    <th>Cliente</th>
                    <th>Nombre</th>
                    <th>VH</th>
                    <th>Ruta</th>
                    <th>Auxiliar</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- filas generadas por JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/main.js"></script>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/sigmaperu/RoadMap/main/RoadMap.csv";

    // Índices RoadMap:
    // 1: Centro
    // 2: Placa
    // 3: Cliente (código)
    // 4: Nombre
    // 5: Detalle nombre
    // 6: Ruta
    // 10: Peso
    // 12: Auxiliar
    // 13: Teléfono
    // 14: complemento dirección
    // 15: dirección
    // 16: Latitud
    // 17: Longitud
    // 18: VH
    // 19: detalle ruta

    let agendaRows = [];
    let centrosAgenda = [];

    const agendaCentroSelect = document.getElementById("agendaCentro");
    const agendaSearchToggle = document.getElementById("agendaSearchToggle");
    const agendaSearchBar = document.getElementById("agendaSearchBar");
    const agendaSearchInput = document.getElementById("agendaSearchInput");
    const agendaTableBody = document.querySelector("#agendaTable tbody");

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      if (lines.length === 0) return { header: [], rows: [] };
      const header = lines[0].split(",");
      const dataLines = lines.slice(1);
      const rows = dataLines.map(line => {
        const result = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      });
      return { header, rows };
    }

    function unique(values) {
      return Array.from(new Set(values.filter(v => v !== "" && v != null)));
    }

    function loadCentros() {
      centrosAgenda = unique(agendaRows.map(r => r[1])).sort();
      agendaCentroSelect.innerHTML = "";
      centrosAgenda.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        agendaCentroSelect.appendChild(opt);
      });
      if (centrosAgenda.length > 0) {
        agendaCentroSelect.value = centrosAgenda[0];
      }
    }

    function buildNombre(row) {
      const nom4 = row[4] || "";
      const nom5 = row[5] || "";
      if (nom5 && nom5 !== "0" && nom5.toLowerCase() !== "error") {
        return nom4 ? (nom4 + " - " + nom5) : nom5;
      }
      return nom4;
    }

    function buildRuta(row) {
      const r6 = row[6] || "";
      const r19 = row[19] || "";
      if (r19 && r19 !== "0" && r19.toLowerCase() !== "error") {
        return r6 ? (r6 + " - " + r19) : r19;
      }
      return r6;
    }

    function buildDireccion(row) {
      const dir15 = row[15] || "";
      const dir14 = row[14] || "";
      let texto = dir15;
      if (dir14 && dir14 !== "0" && dir14.toLowerCase() !== "error") {
        texto = texto ? (texto + " - " + dir14) : dir14;
      }
      return texto;
    }

    function googleMapsLink(row) {
      const lat = parseFloat((row[16] || "").replace(",", "."));
      const lng = parseFloat((row[17] || "").replace(",", "."));
      if (Number.isNaN(lat) || Number.isNaN(lng)) return null;
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng);
    }

    // Decide qué mostrar como “principal” según búsqueda
    function getMainInfo(row, termLower) {
      const placa = (row[2] || "").trim();
      const cliente = (row[3] || "").trim();
      const nombre = buildNombre(row).trim();
      const ruta = buildRuta(row).trim();

      const term = termLower || "";

      const matchPlaca = term && placa.toLowerCase().includes(term);
      const matchRuta = term && ruta.toLowerCase().includes(term);

      if (matchRuta && !matchPlaca) {
        // búsqueda más orientada a ruta
        return {
          line1: ruta || "(Sin ruta)",
          line2: (cliente || "") + (cliente && nombre ? " · " : "") + (nombre || "")
        };
      }

      // por defecto (o búsqueda por placa/cliente/nombre)
      return {
        line1: placa || "(Sin placa)",
        line2: (cliente || "") + (cliente && nombre ? " · " : "") + (nombre || "")
      };
    }

    function renderAgenda() {
      const centroSel = agendaCentroSelect.value;
      const term = (agendaSearchInput.value || "").toLowerCase().trim();

      let rows = agendaRows.filter(r => r[1] === centroSel);

      if (term) {
        rows = rows.filter(r => {
          const placa = (r[2] || "").toLowerCase();
          const cliente = (r[3] || "").toLowerCase();
          const nombre = buildNombre(r).toLowerCase();
          const ruta = buildRuta(r).toLowerCase();
          const auxiliar = (r[12] || "").toLowerCase();
          const telefono = (r[13] || "").toLowerCase();
          const direccion = buildDireccion(r).toLowerCase();
          return (
            placa.includes(term) ||
            cliente.includes(term) ||
            nombre.includes(term) ||
            ruta.includes(term) ||
            auxiliar.includes(term) ||
            telefono.includes(term) ||
            direccion.includes(term)
          );
        });
      }

      agendaTableBody.innerHTML = "";

      rows.forEach(r => {
        const placa = r[2] || "";
        const cliente = r[3] || "";
        const nombre = buildNombre(r);
        const vh = r[18] || "";
        const ruta = buildRuta(r);
        const auxiliar = r[12] || "";
        const telefono = r[13] || "";
        const dirTexto = buildDireccion(r);
        const mapsUrl = googleMapsLink(r);

        const tr = document.createElement("tr");
        tr.classList.add("agenda-card-row");

        // Desktop: celdas normales
        function td(value, label) {
          const cell = document.createElement("td");
          cell.textContent = value || "-";
          cell.setAttribute("data-label", label);
          return cell;
        }

        tr.appendChild(td(placa, "Placa"));
        tr.appendChild(td(cliente, "Cliente"));
        tr.appendChild(td(nombre, "Nombre"));
        tr.appendChild(td(vh, "VH"));
        tr.appendChild(td(ruta, "Ruta"));
        tr.appendChild(td(auxiliar, "Auxiliar"));
        tr.appendChild(td(telefono, "Teléfono"));

        const tdDir = document.createElement("td");
        tdDir.setAttribute("data-label", "Dirección");
        if (mapsUrl) {
          const a = document.createElement("a");
          a.href = mapsUrl;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "agenda-link";
          a.textContent = dirTexto || "Ver en mapa";
          tdDir.appendChild(a);
        } else {
          tdDir.textContent = dirTexto || "-";
        }
        tr.appendChild(tdDir);

        // Modo móvil: contenido compacto dentro de la fila
        const { line1, line2 } = getMainInfo(r, term);
        tr.dataset.mainLine1 = line1;
        tr.dataset.mainLine2 = line2;
        tr.dataset.extra = JSON.stringify({
          vh, ruta, auxiliar, telefono, dirTexto, mapsUrl
        });

        agendaTableBody.appendChild(tr);
      });

      if (rows.length === 0) {
        const trEmpty = document.createElement("tr");
        const tdEmpty = document.createElement("td");
        tdEmpty.colSpan = 8;
        tdEmpty.textContent = "No se encontraron registros.";
        trEmpty.appendChild(tdEmpty);
        agendaTableBody.appendChild(trEmpty);
      }

      applyMobileLayout();
    }

    // Reconstruye contenido de las filas en móvil como cards compactas/expandibles
    function applyMobileLayout() {
      const isMobile = window.matchMedia("(max-width: 800px)").matches;
      const rows = agendaTableBody.querySelectorAll("tr.agenda-card-row");

      rows.forEach(tr => {
        const tds = Array.from(tr.children);
        if (!isMobile) {
          // Desktop: asegurar que se vea la tabla estándar
          tds.forEach((td, idx) => {
            td.style.display = "";
          });
          tr.onclick = null;
          tr.innerHTML = "";
          tds.forEach(td => tr.appendChild(td));
          return;
        }

        // Móvil: construir card compacta
        const mainLine1 = tr.dataset.mainLine1 || "";
        const mainLine2 = tr.dataset.mainLine2 || "";
        let extra = {};
        try {
          extra = JSON.parse(tr.dataset.extra || "{}");
        } catch (_) {}

        tr.innerHTML = "";

        const tdSingle = document.createElement("td");
        tdSingle.style.display = "block";

        const mainDiv = document.createElement("div");
        mainDiv.className = "agenda-row-main";
        mainDiv.textContent = mainLine1;

        const secDiv = document.createElement("div");
        secDiv.className = "agenda-row-secondary";
        secDiv.textContent = mainLine2;

        const extraDiv = document.createElement("div");
        extraDiv.className = "agenda-row-extra";
        extraDiv.style.display = "none";

        const lines = [];
        if (extra.vh) lines.push("VH: " + extra.vh);
        if (extra.ruta) lines.push("Ruta: " + extra.ruta);
        if (extra.auxiliar) lines.push("Auxiliar: " + extra.auxiliar);
        if (extra.telefono) lines.push("Teléfono: " + extra.telefono);
        if (extra.dirTexto) lines.push("Dirección: " + extra.dirTexto);

        extraDiv.textContent = lines.join(" · ");

        tdSingle.appendChild(mainDiv);
        tdSingle.appendChild(secDiv);
        tdSingle.appendChild(extraDiv);
        tr.appendChild(tdSingle);

        tr.onclick = () => {
          const visible = extraDiv.style.display === "block";
          extraDiv.style.display = visible ? "none" : "block";
        };
      });
    }

    async function initAgenda() {
      try {
        const resp = await fetch(CSV_URL);
        const text = await resp.text();
        const { rows } = parseCSV(text);
        agendaRows = rows;
        loadCentros();
        renderAgenda();
      } catch (err) {
        console.error("Error cargando RoadMap.csv en Agenda:", err);
        alert("No se pudo cargar RoadMap.csv para Agenda");
      }

      agendaCentroSelect.addEventListener("change", renderAgenda);

      agendaSearchToggle.addEventListener("click", () => {
        agendaSearchBar.classList.toggle("agenda-search-bar--open");
        if (agendaSearchBar.classList.contains("agenda-search-bar--open")) {
          agendaSearchInput.focus();
        } else {
          agendaSearchInput.value = "";
          renderAgenda();
        }
      });

      agendaSearchInput.addEventListener("input", renderAgenda);

      window.addEventListener("resize", applyMobileLayout);
    }

    document.addEventListener("DOMContentLoaded", initAgenda);
  </script>
</body>
</html>
