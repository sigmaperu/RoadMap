<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes + Material Icons + Estilos (mismos que agenda.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Header global y configuración -->
  <script defer src="assets/js/main.js"></script>

  <style>
    /* ===== Paleta para iconos ===== */
    :root{
      --icon-blue:#2563eb;  /* pedidos */
      --icon-green:#16a34a; /* kg */
      --icon-gold:#b45309;  /* soles */
      --icon-slate:#334155; /* clientes/camiones */
    }
    .icon--blue{ color: var(--icon-blue); }
    .icon--green{ color: var(--icon-green); }
    .icon--gold{ color: var(--icon-gold); }
    .icon--slate{ color: var(--icon-slate); }

    /* ===== Panel genérico ===== */
    .panel {
      background: var(--surface, #fff);
      border-radius: 10px;
      box-shadow: var(--shadow-1, 0 1px 3px rgba(0,0,0,.1));
    }
    .panel__body { padding: 12px 16px; }

    /* ===== Filtros compactos (con labels) ===== */
    .dash-filters { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
    .dash-field{ display:flex; flex-direction:column; gap:6px; min-width:180px; }
    .dash-label{ font-size:.82rem; color:#6b7280; font-weight:500; }
    .dash-select{
      height: 36px; padding: 0 10px;
      border: 1px solid #d1d5db; border-radius: 8px;
      background: #fff; color:#111827; min-width: 160px;
    }

    /* ===== KPIs ===== */
    .kpi-grid{
      display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; margin-top:12px;
    }
    @media (min-width: 760px){
      .kpi-grid{ grid-template-columns: repeat(5, minmax(0,1fr)); gap:16px; }
    }
    .kpi-card{
      background: var(--surface, #fff); border-radius: 10px;
      padding: 14px 16px; box-shadow: var(--shadow-1, 0 1px 3px rgba(0,0,0,.1));
      display:flex; flex-direction:column; min-height:88px;
    }
    .kpi-card__label{ font-size:.9rem; color:#374151; display:flex; align-items:center; gap:8px; }
    .kpi-card__value{ font-size:1.8rem; font-weight:800; margin-top:4px; }

    /* ===== Gráficos (layout) ===== */
    .chart-grid{ display:grid; grid-template-columns:1fr; gap:16px; margin-top:12px; }
    @media (min-width: 1024px){ .chart-grid{ grid-template-columns: 1fr 1fr; } }
    .chart-box{ width:100%; min-height:300px; overflow:hidden; padding:8px; }
    /* SIN leyendas ni textos adicionales */

    /* ===== Accesibilidad ===== */
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
  </style>
</head>
<body data-title="Dashboard">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__logo"><img src="assets/img/logotipo.png" alt="RoadMap"></div>
      <nav class="sidebar__nav">
        <a href="index.html" class="nav-item"><span class="nav-item__icon material-icons">home</span><span>Inicio</span></a>
        <a href="agenda.html" class="nav-item"><span class="nav-item__icon material-icons">event</span><span>Agenda</span></a>
        <a href="dashboard.html" class="nav-item nav-item--active"><span class="nav-item__icon material-icons">dashboard</span><span>Dashboard</span></a>
        <a href="planif.html" class="nav-item"><span class="nav-item__icon material-icons">timeline</span><span>Planificación</span></a>
        <a href="planos.html" class="nav-item"><span class="nav-item__icon material-icons">map</span><span>Planos</span></a>
        <a href="program.html" class="nav-item"><span class="nav-item__icon material-icons">view_week</span><span>Programación</span></a>
        <a href="ubicame.html" class="nav-item"><span class="nav-item__icon material-icons">my_location</span><span>Ubícame</span></a>
      </nav>
    </aside>

    <div class="main-layout">
      <!-- Header global -->
      <div id="app-header"></div>

      <main class="content">
        <section class="page-section">

          <!-- Filtros con labels -->
          <div class="panel">
            <div class="panel__body">
              <div class="dash-filters">
                <div class="dash-field">
                  <label for="dashCentro" class="dash-label">Centro</label>
                  <select id="dashCentro" class="dash-select"></select>
                </div>
                <div class="dash-field">
                  <label for="dashCanal" class="dash-label">Canal</label>
                  <select id="dashCanal" class="dash-select"></select>
                </div>
              </div>
            </div>
          </div>

          <!-- KPIs en orden: Clientes, Pedidos, Kilogramos, Soles, Camiones -->
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-card__label"><span class="material-icons icon--slate">badge</span>Clientes</div>
              <div id="kpiClientes" class="kpi-card__value">–</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-card__label"><span class="material-icons icon--blue">assignment</span>Pedidos</div>
              <div id="kpiPedidos" class="kpi-card__value">–</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-card__label"><span class="material-icons icon--green">monitor_weight</span>Kilogramos</div>
              <div id="kpiKg" class="kpi-card__value">–</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-card__label"><span class="material-icons icon--gold">paid</span>Soles</div>
              <div id="kpiSoles" class="kpi-card__value">–</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-card__label"><span class="material-icons icon--slate">local_shipping</span>Camiones</div>
              <div id="kpiCamiones" class="kpi-card__value">–</div>
            </div>
          </div>

          <!-- Gráficos (sin textos innecesarios) -->
          <div class="chart-grid">
            <div class="panel">
              <div class="panel__body">
                <h3 class="sr-only">Pedidos por Centro (Top 10)</h3>
                <div id="chartCentro" class="chart-box" role="img" aria-label="Barras de pedidos por centro"></div>
              </div>
            </div>
            <div class="panel">
              <div class="panel__body">
                <h3 class="sr-only">Pedidos por Ruta (Top 10)</h3>
                <div id="chartRuta" class="chart-box" role="img" aria-label="Barras de pedidos por ruta"></div>
              </div>
            </div>
          </div>

        </section>
      </main>
    </div>
  </div>

  <!-- JS específico del Dashboard -->
  <script>
    (() => {
      // === Config de data ===
      const CSV_URL =
        (window.RoadMapConfig && window.RoadMapConfig.CSV_URL)
        || "https://raw.githubusercontent.com/sigmaperu/RoadMap/main/RoadMap.csv";

      // Índices de columnas de tu CSV
      const IDX = {
        CENTRO: 1,
        PLACA: 2,
        CLIENTE: 3,
        RUTA: 6,
        PEDIDO: 7,
        KG: 10,
        SOLES: 11,
        CANAL: 19
      };

      const EXCLUDE_PLATE = "FRT-001";
      const EXCLUDE_PLATES_FOR_TRUCKS = new Set(["FRT-001", "RES-CLI"]); // solo KPI Camiones

      // -------- Utilidades --------
      function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        if (lines.length === 0) return { header: [], rows: [] };
        const header = lines[0].split(",");
        const dataLines = lines.slice(1);
        const rows = dataLines.map(line => {
          const result = []; let current = ""; let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
              if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
              else { inQuotes = !inQuotes; }
            } else if (ch === "," && !inQuotes) { result.push(current); current = ""; }
            else { current += ch; }
          }
          result.push(current);
          return result;
        });
        return { header, rows };
      }

      const unique = arr => Array.from(new Set(arr.filter(v => v !== "" && v != null)));
      const toNum = v => {
        const n = parseFloat(String(v ?? "0").toString().replace(",", "."));
        return isNaN(n) ? 0 : n;
      };
      const isExcludedDefault = r => (String(r[IDX.PLACA] || "").trim().toUpperCase() === EXCLUDE_PLATE);
      const isExcludedForTrucks = r => EXCLUDE_PLATES_FOR_TRUCKS.has(String(r[IDX.PLACA] || "").trim().toUpperCase());

      // -------- Estado DOM --------
      const selCentro = document.getElementById("dashCentro");
      const selCanal  = document.getElementById("dashCanal");

      const kpiClientes = document.getElementById("kpiClientes");
      const kpiPedidos  = document.getElementById("kpiPedidos");
      const kpiKg       = document.getElementById("kpiKg");
      const kpiSoles    = document.getElementById("kpiSoles");
      const kpiCamiones = document.getElementById("kpiCamiones");

      let allRows = [];

      // -------- Inicio --------
      async function init() {
        try {
          const resp = await fetch(CSV_URL);
          const text = await resp.text();
          const { rows } = parseCSV(text);
          allRows = rows;

          // Rellenar selects (con 'Todos' al inicio)
          const centros = ["Todos", ...unique(allRows.map(r => r[IDX.CENTRO] || "")).sort()];
          selCentro.innerHTML = centros.map(c => `<option value="${c}">${c}</option>`).join("");
          selCentro.value = "Todos";

          const canales = ["Todos", ...unique(allRows.map(r => r[IDX.CANAL] || "")).sort()];
          selCanal.innerHTML = canales.map(c => `<option value="${c}">${c}</option>`).join("");
          selCanal.value = "Todos";

          // Listeners
          selCentro.addEventListener("change", render);
          selCanal.addEventListener("change", render);
          window.addEventListener("resize", renderCharts);

          render();
        } catch (err) {
          console.error("Error cargando RoadMap.csv en Dashboard:", err);
          alert("No se pudo cargar RoadMap.csv para Dashboard");
        }
      }

      // -------- Filtros --------
      function applyFilters(rows, { includeCentro = true, includeCanal = true } = {}) {
        const cSel = selCentro.value || "Todos";
        const canalSel = selCanal.value || "Todos";
        return rows.filter(r => {
          const okCentro = !includeCentro || cSel === "Todos" || (r[IDX.CENTRO] || "") === cSel;
          const okCanal  = !includeCanal || canalSel === "Todos" || (r[IDX.CANAL] || "") === canalSel;
          return okCentro && okCanal;
        });
      }

      // -------- KPIs --------
      function renderKPIs() {
        const rows = applyFilters(allRows, { includeCentro:true, includeCanal:true });

        // Clientes únicos [3] EXCL FRT-001
        const clientes = unique(rows.filter(r => !isExcludedDefault(r)).map(r => r[IDX.CLIENTE] || ""));
        // Pedidos únicos [7] EXCL FRT-001
        const pedidos  = unique(rows.filter(r => !isExcludedDefault(r)).map(r => r[IDX.PEDIDO] || ""));
        // KG suma [10] EXCL FRT-001
        const kg = rows.filter(r => !isExcludedDefault(r)).reduce((a, r) => a + toNum(r[IDX.KG]), 0);
        // Soles suma [11] EXCL FRT-001
        const soles = rows.filter(r => !isExcludedDefault(r)).reduce((a, r) => a + toNum(r[IDX.SOLES]), 0);
        // Camiones únicos [2] EXCL FRT-001 y RES-CLI (solo este KPI)
        const camiones = unique(rows.filter(r => !isExcludedForTrucks(r)).map(r => r[IDX.PLACA] || ""));

        kpiClientes.textContent = clientes.length.toLocaleString();
        kpiPedidos.textContent  = pedidos.length.toLocaleString();
        kpiKg.textContent       = kg.toLocaleString(undefined, { maximumFractionDigits: 2 });
        kpiSoles.textContent    = soles.toLocaleString(undefined, { maximumFractionDigits: 2 });
        kpiCamiones.textContent = camiones.length.toLocaleString();
      }

      // -------- Gráficos SVG minimalistas --------
      function mountBarChartSVG(containerId, series, options = {}) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        const width = container.clientWidth || 600;
        const height = Math.max(240, 20 + series.length * 22);
        const padding = { top: 8, right: 18, bottom: 8, left: 140 };

        const maxVal = Math.max(1, ...series.map(d => d.value));
        const barH = Math.max(12, (height - padding.top - padding.bottom) / Math.max(1, series.length) - 6);
        const barGap = 6;
        const plotH = series.length * (barH + barGap);

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${Math.max(height, padding.top + plotH + padding.bottom)}`);
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");

        // Barras + etiquetas (sin ejes, sin leyendas)
        series.forEach((d, i) => {
          const y = padding.top + i * (barH + barGap);
          const w = ((width - padding.left - padding.right) * d.value) / maxVal;

          const rect = document.createElementNS(svgNS, "rect");
          rect.setAttribute("x", padding.left);
          rect.setAttribute("y", y);
          rect.setAttribute("width", Math.max(2, w));
          rect.setAttribute("height", barH);
          rect.setAttribute("rx", "4");
          rect.setAttribute("fill", options.barColor || "#2563eb");
          svg.appendChild(rect);

          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", padding.left - 8);
          label.setAttribute("y", y + barH * 0.72);
          label.setAttribute("text-anchor", "end");
          label.setAttribute("font-size", "12");
          label.setAttribute("fill", "#374151");
          label.textContent = d.label;
          svg.appendChild(label);

          const val = document.createElementNS(svgNS, "text");
          val.setAttribute("x", padding.left + w + 6);
          val.setAttribute("y", y + barH * 0.72);
          val.setAttribute("font-size", "12");
          val.setAttribute("fill", "#111827");
          val.textContent = d.value.toLocaleString();
          svg.appendChild(val);
        });

        container.appendChild(svg);
      }

      function groupUniqueCount(rows, keyFn, uniqueKeyFn) {
        const map = new Map(); // key -> Set(unique)
        rows.forEach(r => {
          const key = keyFn(r);
          const uniq = uniqueKeyFn(r);
          if (!key || !uniq) return;
          if (!map.has(key)) map.set(key, new Set());
          map.get(key).add(uniq);
        });
        return Array.from(map.entries()).map(([label, setVals]) => ({ label, value: setVals.size }));
      }
      const topN = (list, n=10) => list.sort((a,b)=>b.value-a.value).slice(0, n);

      function renderCharts() {
        // 1) Pedidos por Centro (comparativo): filtra SOLO por Canal; excluye FRT-001
        const rowsCentro = applyFilters(allRows, { includeCentro:false, includeCanal:true })
          .filter(r => !isExcludedDefault(r));
        const porCentro = groupUniqueCount(
          rowsCentro,
          r => r[IDX.CENTRO] || "",
          r => r[IDX.PEDIDO] || ""
        );
        mountBarChartSVG("chartCentro", topN(porCentro, 10), { barColor: "#2563eb" });

        // 2) Pedidos por Ruta: filtra por Centro y Canal; excluye FRT-001
        const rowsRuta = applyFilters(allRows, { includeCentro:true, includeCanal:true })
          .filter(r => !isExcludedDefault(r));
        const porRuta = groupUniqueCount(
          rowsRuta,
          r => {
            const ruta = r[IDX.RUTA] || "";
            const canal = r[IDX.CANAL] || "";
            return (ruta || canal) ? `${ruta}${canal ? " - " + canal : ""}` : "";
          },
          r => r[IDX.PEDIDO] || ""
        );
        mountBarChartSVG("chartRuta", topN(porRuta, 10), { barColor: "#16a34a" });
      }

      function render() {
        renderKPIs();
        renderCharts();
      }

      document.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
``
