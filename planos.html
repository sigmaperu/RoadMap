<html lang="es">

  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

    crossorigin=""
  />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    .map-wrapper {
      position: relative;
      width: 100%;
    }

    #map {
      width: 100%;
      height: 560px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-elevated);
      overflow: hidden;
    }

    /* Panel flotante de filtros ocupando casi todo el ancho */
    .filters-floating {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filters-floating__title {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
    }

    .filters-floating__row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 120px;
    }

    .filter-group label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .filter-group select {
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.2);
      font-family: inherit;
      font-size: 0.85rem;
      background-color: #fff;
      width: 100%;
    }

    .filters-floating__actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-small {
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      background-color: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-small .material-icons {
      font-size: 18px;
    }

    .btn-small:hover {
      background-color: var(--primary-dark);
    }

    .filters-floating__hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 920px) {
      #map {
        height: 650px; /* mapa más grande en móvil */
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__logo">
        <img src="assets/img/logotipo.png" alt="RoadMap">
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="nav-item">
          <span class="nav-item__icon material-icons">home</span>
          <span class="nav-item__label">Inicio</span>
        </a>
        <a href="agenda.html" class="nav-item">
          <span class="nav-item__icon material-icons">event</span>
          <span class="nav-item__label">Agenda</span>
        </a>
        <a href="dashboard.html" class="nav-item">
          <span class="nav-item__icon material-icons">dashboard</span>
          <span class="nav-item__label">Dashboard</span>
        </a>
        <a href="planif.html" class="nav-item">
          <span class="nav-item__icon material-icons">timeline</span>
          <span class="nav-item__label">Planificación</span>
        </a>
        <a href="planos.html" class="nav-item nav-item--active">
          <span class="nav-item__icon material-icons">map</span>
          <span class="nav-item__label">Planos</span>
        </a>
        <a href="program.html" class="nav-item">
          <span class="nav-item__icon material-icons">view_week</span>
          <span class="nav-item__label">Programación</span>
        </a>
        <a href="ubicame.html" class="nav-item">
          <span class="nav-item__icon material-icons">my_location</span>
          <span class="nav-item__label">Ubícame</span>
        </a>
      </nav>
    </aside>

    <div class="main-layout">
      <header class="topbar">
        <div class="topbar__title">
          <button class="icon-button icon-button--menu" aria-label="Menú" id="menuToggle">
            <span class="material-icons">menu</span>
          </button>
          <h1>Planos</h1>
        </div>
        <div class="topbar__actions">
          <button class="icon-button" aria-label="Notificaciones">
            <span class="material-icons">notifications</span>
          </button>
          <button class="icon-button" aria-label="Perfil">
            <span class="material-icons">account_circle</span>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="page-section">
          <div class="map-wrapper">
            <div class="filters-floating">
              <h3 class="filters-floating__title">Filtros</h3>

              <div class="filters-floating__row">
                <div class="filter-group">
                  <label for="filterCentro">Centro</label>
                  <select id="filterCentro">
                    <option value="">Todos</option>
                  </select>
                </div>

                <div class="filter-group">
                  <label for="filterPlaca">Placa</label>
                  <select id="filterPlaca">
                    <option value="">Todos</option>
                  </select>
                </div>

                <div class="filter-group">
                  <label for="filterCliente">Cliente</label>
                  <select id="filterCliente">
                    <option value="">Todos</option>
                  </select>
                </div>
              </div>

              <div class="filters-floating__actions">
                <span class="filters-floating__hint">Fuente: RoadMap.csv</span>
                <button id="btnLocateMe" class="btn-small" type="button">
                  <span class="material-icons">my_location</span>
                  Mi ubicación
                </button>
              </div>
            </div>

            <div id="map"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="assets/js/main.js"></script>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/sigmaperu/RoadMap/main/RoadMap.csv";

    // Índices:
    // 1: Centro
    // 2: Placa / unidad
    // 4: Cliente
    // 5: detalle cliente
    // 16: Latitud
    // 17: Longitud

    let allRows = [];
    let leafletMap = null;
    let markersLayer = null;

    const filterCentro = document.getElementById("filterCentro");
    const filterPlaca = document.getElementById("filterPlaca");
    const filterCliente = document.getElementById("filterCliente");
    const btnLocateMe = document.getElementById("btnLocateMe");

    // Icono estilo Google Maps (pin sencillo)[web:42][web:52]
    const pinIcon = L.icon({
      iconUrl: "https://maps.gstatic.com/mapfiles/api-3/images/spotlight-poi2_hdpi.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [0, -30]
    });

    // Parser CSV robusto[web:62]
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      const header = lines.shift().split(",");
      const rows = lines.map(line => {
        const result = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      });
      return { header, rows };
    }

    function unique(values) {
      return Array.from(new Set(values.filter(v => v !== "" && v != null)));
    }

    function loadFilters() {
      const centros = unique(allRows.map(r => r[1]));
      const placas = unique(allRows.map(r => r[2]));
      const clientes = unique(allRows.map(r => r[4]));

      centros.sort().forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        filterCentro.appendChild(opt);
      });

      placas.sort().forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        filterPlaca.appendChild(opt);
      });

      clientes.sort().forEach(cli => {
        const rowsCli = allRows.filter(r => r[4] === cli);
        const extra = rowsCli[0] ? (rowsCli[0][5] || "") : "";
        let label = cli;
        if (extra && extra !== "0" && extra.toLowerCase() !== "error") {
          label = cli + " - " + extra;
        }
        const opt = document.createElement("option");
        opt.value = cli;
        opt.textContent = label;
        filterCliente.appendChild(opt);
      });
    }

    function applyFilters() {
      const centro = filterCentro.value;
      const placa = filterPlaca.value;
      const cliente = filterCliente.value;

      let filtered = allRows.slice();

      if (centro) {
        filtered = filtered.filter(r => r[1] === centro);
      }
      if (placa) {
        filtered = filtered.filter(r => r[2] === placa);
      }
      if (cliente) {
        filtered = filtered.filter(r => r[4] === cliente);
      }

      // Agrupar por cliente (valor único col 4) y tomar una lat/lon válida por cliente
      const clientMap = new Map();

      filtered.forEach(r => {
        const clientKey = r[4];
        if (!clientKey) return;

        const lat = parseFloat((r[16] || "").replace(",", "."));
        const lng = parseFloat((r[17] || "").replace(",", "."));
        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

        if (!clientMap.has(clientKey)) {
          const centroVal = r[1];
          const placaVal = r[2];
          const extraVal = r[5];

          let clienteLabel = clientKey;
          if (extraVal && extraVal !== "0" && extraVal.toLowerCase() !== "error") {
            clienteLabel = clientKey + " - " + extraVal;
          }

          clientMap.set(clientKey, {
            centro: centroVal,
            placa: placaVal,
            cliente: clienteLabel,
            lat,
            lng
          });
        }
      });

      const points = Array.from(clientMap.values());
      renderMarkers(points);
    }

    function initMap() {
      if (leafletMap) return;

      leafletMap = L.map("map").setView([-9.19, -75.02], 5);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(leafletMap);

      markersLayer = L.layerGroup().addTo(leafletMap);
    }

    function renderMarkers(points) {
      if (!leafletMap || !markersLayer) return;

      markersLayer.clearLayers();

      const bounds = [];

      points.forEach(p => {
        const marker = L.marker([p.lat, p.lng], {
          icon: pinIcon
        }).bindPopup(
          "<strong>Cliente:</strong> " + p.cliente +
          "<br><strong>Centro:</strong> " + p.centro +
          "<br><strong>Placa (ejemplo):</strong> " + (p.placa || "")
        );
        marker.addTo(markersLayer);
        bounds.push([p.lat, p.lng]);
      });

      if (bounds.length > 0) {
        leafletMap.fitBounds(bounds, { padding: [30, 30] });
      } else {
        leafletMap.setView([-9.19, -75.02], 5);
      }
    }

    function locateUser() {
      if (!leafletMap || !navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        position => {
          const { latitude, longitude } = position.coords;

          const userMarker = L.circleMarker([latitude, longitude], {
            radius: 4,               // más pequeño
            color: "#000000",
            fillColor: "#000000",
            fillOpacity: 1
          }).bindPopup("Mi ubicación");
          userMarker.addTo(leafletMap);

          leafletMap.setView([latitude, longitude], 14);
        },
        error => {
          console.error("Error al obtener ubicación:", error);
          alert("No se pudo obtener tu ubicación.");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000
        }
      );
    }

    async function initPlanosPage() {
      initMap();

      try {
        const resp = await fetch(CSV_URL);
        const text = await resp.text();
        const { rows } = parseCSV(text);
        allRows = rows;

        loadFilters();
        applyFilters();
      } catch (err) {
        console.error("Error cargando CSV:", err);
        alert("No se pudo cargar RoadMap.csv");
      }

      filterCentro.addEventListener("change", applyFilters);
      filterPlaca.addEventListener("change", applyFilters);
      filterCliente.addEventListener("change", applyFilters);

      btnLocateMe.addEventListener("click", locateUser);
    }

    document.addEventListener("DOMContentLoaded", initPlanosPage);
  </script>
</body>
</html>
