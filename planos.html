<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RoadMap – Planos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  
  <!-- Estilos globales y específicos -->
  <link rel="stylesheet" href="assets/css/styles.css?v=22.0">
  <link rel="stylesheet" href="assets/css/planos.css?v=22.0">

  <!-- Scripts -->
  <script defer src="assets/js/main.js"></script>
  <script defer src="assets/js/planos.js"></script>
</head>

<body data-title="Planos">
  <div class="app-shell">
    <!-- Sidebar Modular Estándar -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-layout">
      <div id="app-header"></div>

      <main class="content">
        <section class="page-section">
          <div class="map-wrapper">

            <!-- PANTALLA SELECTORA INICIAL (Optimización de Rendimiento) -->
            <div id="initialSelectorOverlay" class="initial-selector-overlay">
              <div class="selector-card">
                <div class="selector-card__header">
                  <span class="material-icons">map</span>
                  <div>
                    <h2>Configuración de Planos</h2>
                    <p>Selecciona los filtros para inicializar el mapa</p>
                  </div>
                </div>

                <div class="selector-form-group">
                  <label for="initCentro">Centro / Location</label>
                  <select id="initCentro"><option value="">Todos los centros</option></select>
                </div>

                <div class="selector-form-group">
                  <label for="initPlaca">Placa</label>
                  <select id="initPlaca"><option value="">Todas las placas</option></select>
                </div>

                <div class="selector-form-group">
                  <label for="initCliente">Cliente</label>
                  <select id="initCliente"><option value="">Todos los clientes</option></select>
                </div>

                <button id="btnLaunchMap" class="btn-launch-map" type="button">
                  <span class="material-icons">visibility</span> Ver Mapa Logístico
                </button>
              </div>
            </div>

            <!-- Toolbar de Filtros Internos del Mapa -->
            <div class="map-toolbar">
              <button id="btnToggleFilters" class="btn-small-icon" type="button" title="Modificar filtros">
                <span class="material-icons">tune</span>
              </button>

              <div id="filtersPanel" class="filters-floating filters-floating--collapsed">
                <div class="filters-floating__row">
                  <div class="filter-group">
                    <label for="filterCentro">Centro</label>
                    <select id="filterCentro"><option value="">Todos</option></select>
                  </div>
                  <div class="filter-group">
                    <label for="filterPlaca">Placa</label>
                    <select id="filterPlaca"><option value="">Todos</option></select>
                  </div>
                  <div class="filter-group">
                    <label for="filterCliente">Cliente</label>
                    <select id="filterCliente"><option value="">Todos</option></select>
                  </div>
                </div>
              </div>
            </div>

            <!-- Contenedor del Mapa Leaflet -->
            <div id="map"></div>

          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
</body>
</html>
