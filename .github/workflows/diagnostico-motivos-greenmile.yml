name: Diagnóstico motivos GreenMile

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Fecha operativa YYYY-MM-DD"
        required: true
        default: "2026-09-23"
        type: string
      only_programmed:
        description: "Limitar a RoadMap_Shipment.json"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar script y secretos
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f diagnosticar_motivos_greenmile.py
          test -n "$GREENMILE_USERNAME"
          test -n "$GREENMILE_PASSWORD"
          python -m py_compile diagnosticar_motivos_greenmile.py

      - name: Ejecutar diagnóstico
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
          GREENMILE_TARGET_DATE: ${{ inputs.target_date }}
          GREENMILE_ONLY_PROGRAMMED: ${{ inputs.only_programmed }}
          GREENMILE_SCAN_PAGE_SIZE: "100"
          GREENMILE_DETAIL_PAGE_SIZE: "10"
          GREENMILE_MAX_PAGES: "2000"
          GREENMILE_HTTP_RETRIES: "3"
          GREENMILE_MAX_SAMPLES_PER_PATH: "5"
        run: python diagnosticar_motivos_greenmile.py

      - name: Añadir TXT al resumen
        if: always()
        run: |
          shopt -s nullglob
          files=(GreenMile_Diagnostico_Motivos_*.txt)
          if (( ${#files[@]} )); then cat "${files[0]}" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-motivos-greenmile-${{ inputs.target_date }}
          path: |
            GreenMile_Diagnostico_Motivos_*.json
            GreenMile_Diagnostico_Motivos_*.txt
          if-no-files-found: warn
          retention-days: 14
