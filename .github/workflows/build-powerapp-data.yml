name: Generar datos Power Apps

on:
  workflow_run:
    workflows:
      - "Generar estados GreenMile"
      - "Generar RoadMap resumido por Shipment"
    types:
      - completed

  push:
    branches:
      - main
    paths:
      - "RoadMap_Shipment.json"
      - "GreenMile_Estados.json"
      - "scripts/build_powerapp_data.py"
      - ".github/workflows/build-powerapp-data.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-powerapp-data
  cancel-in-progress: true

jobs:
  build-powerapp-data:
    name: Generar PowerApp_Data.json y PowerApp_Data.xlsx

    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio actualizado
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar rama main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "Rama main actualizada correctamente."

      - name: Mostrar versión de Python
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      - name: Verificar dependencias instaladas
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas
          import openpyxl

          print(f"pandas instalado: {pandas.__version__}")
          print(f"openpyxl instalado: {openpyxl.__version__}")
          PY

      - name: Validar archivos requeridos
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "RoadMap_Shipment.json"
            "GreenMile_Estados.json"
            "scripts/build_powerapp_data.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: No existe el archivo requerido: $file"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "ERROR: El archivo requerido está vacío: $file"
              exit 1
            fi

            echo "Archivo encontrado: $file"
          done

          echo "Todos los archivos requeridos están disponibles."

      - name: Validar sintaxis del script
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile scripts/build_powerapp_data.py

          echo "Sintaxis de build_powerapp_data.py validada."

      - name: Eliminar salidas temporales anteriores
        shell: bash
        run: |
          set -euo pipefail

          rm -f PowerApp_Data.json
          rm -f PowerApp_Data.xlsx

          echo "Salidas anteriores eliminadas del entorno de ejecución."

      - name: Generar archivos Power Apps
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_powerapp_data.py

      - name: Comprobar archivos generados
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "PowerApp_Data.json" ]; then
            echo "ERROR: No se generó PowerApp_Data.json"
            exit 1
          fi

          if [ ! -s "PowerApp_Data.json" ]; then
            echo "ERROR: PowerApp_Data.json está vacío"
            exit 1
          fi

          if [ ! -f "PowerApp_Data.xlsx" ]; then
            echo "ERROR: No se generó PowerApp_Data.xlsx"
            exit 1
          fi

          if [ ! -s "PowerApp_Data.xlsx" ]; then
            echo "ERROR: PowerApp_Data.xlsx está vacío"
            exit 1
          fi

          echo "Archivos generados correctamente:"
          ls -lh PowerApp_Data.json PowerApp_Data.xlsx

      - name: Validar PowerApp_Data.json
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("PowerApp_Data.json")

          if not path.exists():
              raise FileNotFoundError(
                  "No existe PowerApp_Data.json."
              )

          if path.stat().st_size == 0:
              raise ValueError(
                  "PowerApp_Data.json está vacío."
              )

          with path.open(
              "r",
              encoding="utf-8"
          ) as file:
              records = json.load(file)

          if not isinstance(records, list):
              raise ValueError(
                  "PowerApp_Data.json no contiene una matriz JSON."
              )

          if not records:
              raise ValueError(
                  "PowerApp_Data.json no contiene registros."
              )

          required_fields = {
              "DeliveryDate",
              "ShipmentCustom",
              "VehicleKey",
              "Location",
              "CustomerAccount",
              "CustomerName",
              "DriverName",
              "DriverBadge",
              "RutaVenta",
              "Canal",
              "KgPlanificados",
              "EstadoMigracion",
              "EstadoConexion",
              "EstadoEntrega",
              "Latitude",
              "Longitude",
              "LatitudActual",
              "LongitudActual",
              "FuenteCoordenada",
              "MotivoNoEntrega",
              "MotivoCancelacion",
          }

          seen_shipments = set()

          for position, record in enumerate(
              records,
              start=1
          ):
              if not isinstance(record, dict):
                  raise ValueError(
                      f"El registro {position} no es un objeto JSON."
                  )

              missing_fields = (
                  required_fields - set(record.keys())
              )

              if missing_fields:
                  raise ValueError(
                      f"Registro {position} incompleto. "
                      f"Faltan campos: {sorted(missing_fields)}"
                  )

              shipment = str(
                  record.get("ShipmentCustom", "")
              ).strip()

              if shipment == "":
                  raise ValueError(
                      f"Registro {position} sin ShipmentCustom."
                  )

              if shipment in seen_shipments:
                  raise ValueError(
                      "ShipmentCustom duplicado en el resultado: "
                      f"{shipment}"
                  )

              seen_shipments.add(shipment)

          print("PowerApp_Data.json validado correctamente.")
          print(f"Registros: {len(records)}")
          print(f"Shipments únicos: {len(seen_shipments)}")
          print(f"Tamaño: {path.stat().st_size} bytes")
          PY

      - name: Validar PowerApp_Data.xlsx
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path("PowerApp_Data.xlsx")

          if not path.exists():
              raise FileNotFoundError(
                  "No existe PowerApp_Data.xlsx."
              )

          if path.stat().st_size == 0:
              raise ValueError(
                  "PowerApp_Data.xlsx está vacío."
              )

          workbook = load_workbook(
              filename=path,
              read_only=False,
              data_only=False
          )

          try:
              expected_sheet = "Data"
              expected_table = "PowerAppData"

              if expected_sheet not in workbook.sheetnames:
                  raise ValueError(
                      "PowerApp_Data.xlsx no contiene "
                      "la hoja Data."
                  )

              worksheet = workbook[expected_sheet]

              if worksheet.max_row < 2:
                  raise ValueError(
                      "La hoja Data no contiene registros."
                  )

              if worksheet.max_column < 1:
                  raise ValueError(
                      "La hoja Data no contiene columnas."
                  )

              headers = [
                  worksheet.cell(
                      row=1,
                      column=column
                  ).value
                  for column in range(
                      1,
                      worksheet.max_column + 1
                  )
              ]

              expected_headers = [
                  "DeliveryDate",
                  "ShipmentCustom",
                  "VehicleKey",
                  "Location",
                  "CustomerAccount",
                  "CustomerName",
                  "DriverName",
                  "DriverBadge",
                  "RutaVenta",
                  "Canal",
                  "KgPlanificados",
                  "EstadoMigracion",
                  "EstadoConexion",
                  "EstadoEntrega",
                  "Latitude",
                  "Longitude",
                  "LatitudActual",
                  "LongitudActual",
                  "FuenteCoordenada",
                  "MotivoNoEntrega",
                  "MotivoCancelacion",
              ]

              if headers != expected_headers:
                  raise ValueError(
                      "Las columnas del Excel no coinciden "
                      "con la estructura esperada.\n"
                      f"Esperadas: {expected_headers}\n"
                      f"Encontradas: {headers}"
                  )

              available_tables = list(
                  worksheet.tables.keys()
              )

              if expected_table not in available_tables:
                  raise ValueError(
                      "La hoja Data no contiene la tabla "
                      "PowerAppData."
                  )

              table = worksheet.tables[expected_table]

              print(
                  "PowerApp_Data.xlsx validado correctamente."
              )
              print(f"Hoja: {worksheet.title}")
              print(
                  f"Registros: {worksheet.max_row - 1}"
              )
              print(
                  f"Columnas: {worksheet.max_column}"
              )
              print(f"Tabla: {table.name}")
              print(f"Rango de tabla: {table.ref}")
              print(
                  f"Tamaño: {path.stat().st_size} bytes"
              )

          finally:
              workbook.close()
          PY

      - name: Mostrar cambios generados
        shell: bash
        run: |
          set -euo pipefail

          echo "Cambios detectados:"
          git status --short -- \
            PowerApp_Data.json \
            PowerApp_Data.xlsx

          echo "Archivos disponibles:"
          ls -lh \
            PowerApp_Data.json \
            PowerApp_Data.xlsx

      - name: Guardar archivos generados
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- PowerApp_Data.json PowerApp_Data.xlsx)" ]; then
            echo "No hay cambios en los archivos Power Apps."
            echo "No se creará un nuevo commit."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add PowerApp_Data.json
          git add PowerApp_Data.xlsx

          git commit \
            -m "Actualizar datos Power Apps"

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            main

          echo "PowerApp_Data.json guardado en main."
          echo "PowerApp_Data.xlsx guardado en main."
          echo "Workflow finalizado correctamente."
