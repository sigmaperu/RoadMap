name: Generar estados GreenMile

on:
  workflow_run:
    workflows:
      - "Generar RoadMap resumido por Shipment"
    types:
      - completed

  schedule:
    - cron: "*/1 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-greenmile-status
  cancel-in-progress: false

jobs:
  build-greenmile-status:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar archivos requeridos
        shell: bash
        run: |
          test -f "RoadMap_Shipment.json"
          test -f "scripts/build_greenmile_status.py"

      - name: Validar sintaxis
        run: |
          python -m py_compile scripts/build_greenmile_status.py

      - name: Generar estados GreenMile
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
          GREENMILE_SCAN_PAGE_SIZE: "100"
          GREENMILE_MAX_PAGES: "2000"
        run: |
          python scripts/build_greenmile_status.py

      - name: Validar GreenMile_Estados.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("GreenMile_Estados.json")

          if not path.exists():
              raise ValueError("No se generó GreenMile_Estados.json")

          with path.open("r", encoding="utf-8") as file:
              records = json.load(file)

          if not isinstance(records, list):
              raise ValueError("GreenMile_Estados.json no es una matriz")

          if len(records) == 0:
              raise ValueError("GreenMile_Estados.json está vacío")

          required = {
              "ShipmentCustom",
              "VehicleKey",
              "Location",
              "FechaOperacion",
              "EstadoMigracion",
              "EstadoConexion",
              "EstadoEntrega",
              "MotivoNoEntrega",
          }

          for position, record in enumerate(records, start=1):
              missing = required - set(record)
              if missing:
                  raise ValueError(
                      f"Registro {position} incompleto: {sorted(missing)}"
                  )

          print(f"JSON validado. Registros: {len(records)}")
          PY

      - name: Guardar estados generados
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- GreenMile_Estados.json)" ]; then
            echo "GreenMile_Estados.json no cambió."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add GreenMile_Estados.json
          git commit -m "Actualizar estados GreenMile"
          git pull --rebase origin main
          git push origin main
