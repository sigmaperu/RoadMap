name: Generar Reporte HTML Radar de Distribución

on:
  push:
    paths:
      - 'RoadMap.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías de mapa estático
        run: pip install staticmap pillow

      - name: Generar HTML, Mapa PNG y CSV de Incidencias
        run: python scripts/build_radar_email.py

      - name: Publicar archivos en /reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/radar_email.html reports/mapa_riesgo.png reports/incidencias_radar.csv
          git diff --staged --quiet || git commit -m "chore: actualizar reporte HTML y mapa del Radar"
          git push
