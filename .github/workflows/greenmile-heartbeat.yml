name: GreenMile Heartbeat

on:
  schedule:
    - cron: "*/7 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat-greenmile

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .heartbeat-greenmile

          git diff --staged --quiet && exit 0

          git commit -m "Heartbeat GreenMile"
          git push
