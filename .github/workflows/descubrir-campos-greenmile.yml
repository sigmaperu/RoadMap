name: Descubrimiento exhaustivo campos GreenMile

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Fecha operativa YYYY-MM-DD"
        required: true
        default: "2026-09-23"
        type: string
      max_sample_routes:
        description: "Cantidad de rutas muestra"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  descubrir_campos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f descubrir_campos_greenmile.py
          test -n "$GREENMILE_USERNAME"
          test -n "$GREENMILE_PASSWORD"
          python -m py_compile descubrir_campos_greenmile.py
      - name: Ejecutar descubrimiento
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
          GREENMILE_TARGET_DATE: ${{ inputs.target_date }}
          GREENMILE_MAX_SAMPLE_ROUTES: ${{ inputs.max_sample_routes }}
          GREENMILE_SCAN_PAGE_SIZE: "100"
          GREENMILE_DETAIL_PAGE_SIZE: "10"
          GREENMILE_PROBE_PAUSE_SECONDS: "0.15"
          GREENMILE_HTTP_RETRIES: "3"
        run: python descubrir_campos_greenmile.py
      - name: Resumen
        if: always()
        run: |
          shopt -s nullglob
          files=(GreenMile_Descubrimiento_Campos_*.txt)
          if (( ${#files[@]} )); then cat "${files[0]}" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: descubrimiento-campos-greenmile-${{ inputs.target_date }}
          path: |
            GreenMile_Descubrimiento_Campos_*.json
            GreenMile_Descubrimiento_Campos_*.txt
          if-no-files-found: warn
          retention-days: 14
