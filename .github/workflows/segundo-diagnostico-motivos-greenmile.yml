name: Segundo diagnóstico motivos GreenMile

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Fecha operativa YYYY-MM-DD"
        required: true
        default: "2026-09-23"
        type: string

permissions:
  contents: read

jobs:
  diagnostico_relaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f diagnosticar_relaciones_motivos_greenmile.py
          test -n "$GREENMILE_USERNAME"
          test -n "$GREENMILE_PASSWORD"
          python -m py_compile diagnosticar_relaciones_motivos_greenmile.py
      - name: Ejecutar
        env:
          GREENMILE_USERNAME: ${{ secrets.GREENMILE_USERNAME }}
          GREENMILE_PASSWORD: ${{ secrets.GREENMILE_PASSWORD }}
          GREENMILE_TARGET_DATE: ${{ inputs.target_date }}
          GREENMILE_SCAN_PAGE_SIZE: "100"
          GREENMILE_DETAIL_PAGE_SIZE: "5"
          GREENMILE_MAX_REJECTED_STOPS: "100"
        run: python diagnosticar_relaciones_motivos_greenmile.py
      - name: Resumen
        if: always()
        run: |
          shopt -s nullglob
          files=(GreenMile_Diagnostico_Relaciones_Motivos_*.txt)
          if (( ${#files[@]} )); then cat "${files[0]}" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segundo-diagnostico-motivos-${{ inputs.target_date }}
          path: |
            GreenMile_Diagnostico_Relaciones_Motivos_*.json
            GreenMile_Diagnostico_Relaciones_Motivos_*.txt
          if-no-files-found: warn
          retention-days: 14
